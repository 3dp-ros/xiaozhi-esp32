name: Build S3-Zero Sala

on:
  workflow_dispatch:
  push:
    branches:
      - s3zero

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Hey Kira
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          mkdir -p out

          python scripts/build.py s3zero-sala --name s3zero-sala \
            --language es-ES \
            --wake-word wn9_heykira_tts3
          cp build/merged-binary.bin out/xiaozhi-kira.bin

          ls -l out

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-s3zero-sala
          path: out/*.bin
          if-no-files-found: error
